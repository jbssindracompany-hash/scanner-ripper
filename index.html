<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Ripper - V1.8-C</title>

  <!-- Lector de códigos de barras / QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .scanner-app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.10);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      text-align: center;
    }

    .subtitulo {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .ubicacion {
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 14px;
    }

    #reader {
      width: 100%;
      min-height: 280px;
      overflow: hidden;
      border-radius: 12px;
      background: #111827;
    }

    .botones {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #btnIniciar {
      background: #111827;
      color: white;
    }

    #btnDetener {
      background: #e5e7eb;
      color: #111827;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .estado {
      margin-top: 14px;
      padding: 11px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      background: #f3f4f6;
    }

    .estado.ok {
      background: #dcfce7;
      color: #166534;
    }

    .estado.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .resultado {
      display: none;
    }

    .resultado.visible {
      display: block;
    }

    .fila {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .fila:last-child {
      border-bottom: 0;
    }

    .etiqueta {
      color: #6b7280;
    }

    .valor {
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .sku-grande {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      margin: 4px 0 12px;
    }

    .nota {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="scanner-app">

    <div class="card">
      <h1>📷 Scanner Ripper</h1>
      <div class="subtitulo">V1.8-C — Scanner externo integrado</div>

      <div class="ubicacion">
        Ubicación: <span id="ubicacion">NO SELECCIONADA</span>
      </div>

      <div id="reader"></div>

      <div class="botones">
        <button id="btnIniciar" onclick="iniciarScanner()">📷 INICIAR CÁMARA</button>
        <button id="btnDetener" onclick="detenerScanner()" disabled>⛔ DETENER</button>
      </div>

      <div id="estado" class="estado">
        Preparando scanner...
      </div>

      <div class="nota">
        Esta página utiliza la cámara del celular para leer el código de barras.
        El SKU leído se devuelve a la aplicación principal.
      </div>
    </div>

    <div id="resultado" class="card resultado">
      <div class="subtitulo">Último código leído</div>
      <div id="sku" class="sku-grande">—</div>

      <div class="fila">
        <span class="etiqueta">Ubicación</span>
        <span id="resultadoUbicacion" class="valor">—</span>
      </div>

      <div class="fila">
        <span class="etiqueta">Hora</span>
        <span id="hora" class="valor">—</span>
      </div>
    </div>

  </div>

  <script>
    let html5QrCode = null;
    let scannerActivo = false;
    let ultimoCodigo = "";
    let ultimoMomento = 0;

    const PARAMETROS = new URLSearchParams(window.location.search);

    const ubicacionCodigo = (PARAMETROS.get("ubicacion") || "").trim().toUpperCase();
    const ubicacionNombre = (PARAMETROS.get("nombre") || ubicacionCodigo || "NO SELECCIONADA").trim();

    // La aplicación principal nos entrega su origen al abrir esta página.
    // Esto permite devolver el resultado mediante postMessage.
    const targetOrigin = PARAMETROS.get("targetOrigin") || "*";

    document.getElementById("ubicacion").textContent =
      ubicacionCodigo ? ubicacionNombre + " (" + ubicacionCodigo + ")" : "NO SELECCIONADA";

    document.getElementById("resultadoUbicacion").textContent =
      ubicacionCodigo ? ubicacionNombre + " (" + ubicacionCodigo + ")" : "—";

    function mostrarEstado(texto, tipo) {
      const elemento = document.getElementById("estado");
      elemento.textContent = texto;
      elemento.className = "estado" + (tipo ? " " + tipo : "");
    }

    function mostrarResultado(sku) {
      document.getElementById("sku").textContent = sku;
      document.getElementById("hora").textContent =
        new Date().toLocaleTimeString("es-PE", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

      document.getElementById("resultado").classList.add("visible");
    }

    function enviarSKUAlSistema(sku) {
      if (!window.opener || window.opener.closed) {
        mostrarEstado("⚠️ La aplicación principal no está abierta.", "error");
        return;
      }

      window.opener.postMessage({
        type: "PUNTO_CERO_SCAN",
        sku: sku,
        ubicacion: ubicacionCodigo
      }, targetOrigin);

      mostrarResultado(sku);
      mostrarEstado("✅ Código leído y enviado al sistema.", "ok");
    }

    function procesarCodigo(decodedText) {
      const sku = String(decodedText || "").trim().toUpperCase();

      if (!sku) return;

      // Evita registrar varias veces el mismo código por una sola lectura
      // debido a que la cámara puede detectar el mismo código varios frames.
      const ahora = Date.now();

      if (sku === ultimoCodigo && (ahora - ultimoMomento) < 1800) {
        return;
      }

      ultimoCodigo = sku;
      ultimoMomento = ahora;

      enviarSKUAlSistema(sku);
    }

    function iniciarScanner() {
      if (scannerActivo) return;

      try {
        html5QrCode = new Html5Qrcode("reader");

        const config = {
          fps: 10,
          qrbox: { width: 280, height: 160 },
          aspectRatio: 1.777778
        };

        mostrarEstado("Solicitando permiso de cámara...", "");

        html5QrCode.start(
          { facingMode: "environment" },
          config,
          function(decodedText) {
            procesarCodigo(decodedText);
          },
          function(errorMessage) {
            // No mostramos cada error de lectura para evitar ruido visual.
          }
        ).then(function() {
          scannerActivo = true;
          document.getElementById("btnIniciar").disabled = true;
          document.getElementById("btnDetener").disabled = false;
          mostrarEstado("📷 Cámara activa. Apunta al código de barras.", "ok");
        }).catch(function(error) {
          console.error("Error de cámara:", error);

          const nombre = error && error.name ? error.name : "";
          const mensaje = error && error.message ? error.message : String(error || "");

          mostrarEstado(
            "❌ No se pudo iniciar la cámara." +
            (nombre ? " [" + nombre + "]" : "") +
            (mensaje ? " " + mensaje : ""),
            "error"
          );
        });

      } catch (error) {
        console.error("Error iniciando scanner:", error);
        mostrarEstado("❌ Error al preparar el scanner.", "error");
      }
    }

    function detenerScanner() {
      if (!html5QrCode || !scannerActivo) return;

      html5QrCode.stop()
        .then(function() {
          scannerActivo = false;
          document.getElementById("btnIniciar").disabled = false;
          document.getElementById("btnDetener").disabled = true;
          mostrarEstado("Cámara detenida.", "");
        })
        .catch(function(error) {
          console.error("Error deteniendo cámara:", error);
          mostrarEstado("⚠️ No se pudo detener correctamente la cámara.", "error");
        });
    }

    window.addEventListener("beforeunload", function() {
      if (html5QrCode && scannerActivo) {
        html5QrCode.stop().catch(function() {});
      }
    });
  </script>
</body>
</html>
